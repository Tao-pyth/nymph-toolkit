name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -W error -m unittest discover -s tests -t . -v
      - run: python examples/runtime_demo.py
      - run: python examples/registry_demo.py
      - run: python examples/connections_demo.py
      - run: python examples/task_manager_demo.py
      - run: python examples/activity_changes_demo.py
      - run: python examples/hybrid_demo.py
      - run: python examples/module_contract_demo.py
      - run: python examples/memory_demo.py
      - run: python examples/document_demo.py
      - run: python examples/cognition_demo.py
      - run: python -W error tools/validate_hybrid_load.py --duration 1 --requests 8 --chunks 4 --cycle-requests 4 --cycle-chunks 2 --sample-interval 1 --output .git/v09-load-smoke.json
      - run: python tools/check_docs.py
      - run: python tools/check_api.py
      - run: python tools/check_contracts.py
      - run: python tools/check_completion.py
      - run: python -m build
      - run: python tools/check_dist.py
  customer-docs:
    name: Customer Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir tools/customer-docs install --frozen-lockfile
      - run: pnpm --dir tools/customer-docs exec playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r tools/customer-docs/requirements.txt
      - run: python tools/check_customer_docs.py
      - run: node tools/customer-docs/build.mjs
      - run: python tools/check_customer_docs.py --artifacts output/pdf --require-clean --render-dir output/pdf/pages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: customer-docs-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/pdf/
          if-no-files-found: error
          retention-days: 90
