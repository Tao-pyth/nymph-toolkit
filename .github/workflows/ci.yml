name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cognition-shutdown-diagnostic:
    # Temporary investigation for #169; this never replaces acceptance checks.
    if: github.head_ref == 'codex/v1.9-sleep' || github.ref == 'refs/heads/codex/v1.9-sleep'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -W error tools/diagnose_cognition_shutdown.py --attempts 20 --output output/cognition-shutdown.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cognition-shutdown-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/cognition-shutdown.json
          if-no-files-found: warn
          retention-days: 30
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    # Full source + wheel suites include real 4096-row durability tests twice.
    # Windows 3.12 exceeded the former 20-minute job budget (issue #161).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -W error -m unittest discover -s tests -t . -v
      - run: python examples/runtime_demo.py
      - run: python examples/registry_demo.py
      - run: python examples/connections_demo.py
      - run: python examples/task_manager_demo.py
      - run: python examples/activity_changes_demo.py
      - run: python examples/hybrid_demo.py
      - run: python examples/module_contract_demo.py
      - run: python examples/memory_demo.py
      - run: python examples/document_demo.py
      - run: python examples/cognition_demo.py
      - run: python examples/text_interaction_demo.py
      - run: python examples/web_demo.py
      - run: python examples/agency_demo.py
      - run: python examples/agency_execution_demo.py
      - run: python examples/persona_demo.py
      - run: python examples/persona_agency_demo.py
      - run: python examples/sleep_demo.py
      - run: python examples/sleep_activity_demo.py
      - run: python examples/voice_audio_demo.py
      - run: python examples/input_candidate_demo.py
      - run: python examples/runtime_diagnostics_demo.py --seconds 2
      - run: python -W error tools/validate_hybrid_load.py --duration 1 --requests 8 --chunks 4 --cycle-requests 4 --cycle-chunks 2 --sample-interval 1 --output .git/v09-load-smoke.json
      - run: python tools/check_docs.py
      - run: python tools/check_api.py
      - run: python tools/check_contracts.py
      - run: python tools/check_completion.py
      - run: python -m build
      - run: python tools/check_dist.py
  voice-dependencies:
    name: Voice dependencies (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: python -m pip install ".[voice]"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir src/nymph_toolkit/adapters/discord_voice/node install --frozen-lockfile
      - run: node --test tests/voice/test_bridge.mjs tests/voice/test_dependencies.mjs
      - run: python tools/prepare_voice_model.py --destination .local/voice-model
      - run: python -W error tools/validate_voice_asr.py --model .local/voice-model
  customer-docs:
    name: Customer Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir tools/customer-docs install --frozen-lockfile
      - run: pnpm --dir tools/customer-docs exec playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r tools/customer-docs/requirements.txt
      - run: python tools/check_customer_docs.py
      - run: node tools/customer-docs/build.mjs
      - run: python tools/check_customer_docs.py --artifacts output/pdf --require-clean --render-dir output/pdf/pages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: customer-docs-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/pdf/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: customer-docs-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/pdf/
          if-no-files-found: error
          retention-days: 90

  diagnostics-acceptance:
    name: Runtime diagnostics (${{ matrix.os }}, ${{ matrix.requester }}/${{ matrix.provider }})
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/181-runtime-diagnostics'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        requester: [local, process]
        provider: [local, process]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.15"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir tools/customer-docs install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm --dir tools/customer-docs exec playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: pnpm --dir tools/customer-docs exec playwright install chromium
      - run: python -m pip install -e .
      - if: matrix.requester == 'local' && matrix.provider == 'local'
        run: node tools/customer-docs/check-diagnostics.mjs
      - run: >-
          python -W error tools/validate_runtime_diagnostics.py
          --placement ${{ matrix.requester }} ${{ matrix.provider }}
          --output output/diagnostics/ld09.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-diagnostics-${{ matrix.os }}-${{ matrix.requester }}-${{ matrix.provider }}-${{ github.event.pull_request.head.sha }}
          path: output/diagnostics/
          if-no-files-found: warn
