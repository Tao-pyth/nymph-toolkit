<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ntk-console" content="__NTK_CONSOLE_TOKEN__">
<title>NTK Runtime ライブ診断</title>
<link rel="stylesheet" href="/viewer.css">
<script defer src="/viewer.js"></script>
<header>
  <div><p class="product">NYMPH TOOLKIT</p><h1>Runtime ライブ診断</h1></div>
  <span id="runtime" role="status">接続中</span>
</header>
<main>
  <section aria-labelledby="configuration-title">
    <h2 id="configuration-title">実行構成</h2>
    <div id="modules" class="grid"></div>
    <h3>接続</h3>
    <div id="connections"></div>
  </section>
  <section aria-labelledby="activity-title">
    <h2 id="activity-title">活動の予定と実績</h2>
    <div id="activities"></div>
  </section>
  <section aria-labelledby="report-title">
    <h2 id="report-title">アダプタの状態と出力</h2>
    <label for="adapter">アダプタ</label> <select id="adapter"></select>
    <div id="reports"></div>
  </section>
  <section aria-labelledby="event-title">
    <h2 id="event-title">状態変化</h2>
    <label for="event-filter">表示する項目</label>
    <select id="event-filter"><option value="">すべて</option><option value="activity">活動</option><option value="health">接続確認</option><option value="hybrid">プロセス</option></select>
    <ol id="events"></ol>
  </section>
  <section id="console" hidden aria-labelledby="console-title">
    <h2 id="console-title">状態照会</h2>
    <div id="queries"></div>
    <pre id="result" role="status"></pre>
  </section>
</main>
</html>
